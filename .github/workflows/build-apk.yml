name: Build WakeMate AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Line Endings and Permissions
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build Debug APK
        id: gradle_build
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log

      - name: Upload APK to Artifacts
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WakeMate-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with Direct APK Download
        if: steps.gradle_build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "WakeMate AI v1.0.0 (Direct APK)"
          body: "Download `app-debug.apk` directly on your Android phone and tap to install!"
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Build Result
        if: steps.gradle_build.outcome != 'success'
        run: |
          echo "Gradle build failed. Check build-log artifact for details."
          exit 1
