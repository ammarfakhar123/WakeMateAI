name: Build WakeMate AI Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Flutter Doctor
        run: flutter doctor -v

      - name: Scaffold Official Flutter Android Platform
        working-directory: ./wakemate_flutter
        run: |
          flutter create . --org com.wakemate.ai --project-name wakemate_flutter --platforms=android

      - name: Get Flutter Packages
        working-directory: ./wakemate_flutter
        run: flutter pub get

      - name: Build Debug APK
        id: build_step
        working-directory: ./wakemate_flutter
        run: |
          flutter build apk --debug 2>&1 | tee build_flutter.log

      - name: Print Build Log on Failure
        if: failure()
        run: |
          if [ -f wakemate_flutter/build_flutter.log ]; then
            echo "=== FLUTTER BUILD LOG OUTPUT ==="
            cat wakemate_flutter/build_flutter.log | tail -n 120
          fi

      - name: Verify Flutter APK Output
        id: verify_flutter_apk
        run: |
          echo "Searching for generated APK files..."
          APK_PATH=$(find wakemate_flutter/build -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_exists=true" >> $GITHUB_OUTPUT
            echo "Successfully found Flutter APK at: $APK_PATH"
            ls -lh "$APK_PATH"
            cp "$APK_PATH" ./wakemate-flutter-debug.apk
            echo "Copied to ./wakemate-flutter-debug.apk ($(ls -lh ./wakemate-flutter-debug.apk | awk '{print $5}'))"
          else
            echo "apk_exists=false" >> $GITHUB_OUTPUT
            echo "No Flutter APK found anywhere in wakemate_flutter/build!"
            ls -R wakemate_flutter/build || true
          fi

      - name: Upload Artifact
        if: steps.verify_flutter_apk.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wakemate-flutter-debug
          path: ./wakemate-flutter-debug.apk

      - name: Create GitHub Release with Direct APK Download
        if: steps.verify_flutter_apk.outputs.apk_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.${{ github.run_number }}"
          name: "WakeMate AI Flutter v1.1.${{ github.run_number }} (Direct APK)"
          body: |
            ### 🚀 WakeMate AI - Flutter Cross-Platform Release (v1.1.${{ github.run_number }})

            ✨ **Key Features:**
            - 💰 **Personal Finance Manager**: Income, Expense & PKR Net Balance tracking, category breakdowns, transaction history with delete.
            - 📖 **Daily Azkar & Custom Arabic Paste**: Dedicated RTL Arabic text area to paste any custom Dua/Ayat directly from clipboard with interactive **Digital Tasbeeh Counter** (+1 tap, circular progress, haptic feedback).
            - ☀️ **Clean Modern Light Theme**: Apple/Material 3 style with slate & emerald accents.
            - 👤 **Custom User Name**: Personalized morning greetings ("Assalam-o-Alaikum, [Name] 👋").
            - ⚡ **3-Pillar Daily Inspiration**: 40+ Quranic Ayats, 40+ Sahih Ahadith, and 40+ Hard-hitting Grind & Comeback Motivation quotes.
            - ⏰ **Smart Alarms**: 5-minute wake-up check & charging challenge.

            📲 **Direct Download:**
            Click on **`wakemate-flutter-debug.apk`** below under **Assets** to download directly to your phone and install!
          files: ./wakemate-flutter-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail If APK Missing
        if: steps.verify_flutter_apk.outputs.apk_exists != 'true'
        run: |
          echo "ERROR: Flutter APK was not produced."
          exit 1
