name: Build WakeMate AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Line Endings and Permissions
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build Debug APK
        id: gradle_build
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Upload APK to Artifacts
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WakeMate-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with Direct APK Download
        if: steps.gradle_build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "WakeMate AI (Direct APK Download)"
          body: "Click on `app-debug.apk` below under Assets to download directly to your Android phone!"
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Build Failure Summary
        if: steps.gradle_build.outcome != 'success'
        run: |
          echo "### Gradle Build Failed" > build_summary.md
          echo '```' >> build_summary.md
          grep -E "e: |FAILURE|BUILD FAILED|Exception" build_output.log | head -n 40 >> build_summary.md || true
          tail -n 40 build_output.log >> build_summary.md
          echo '```' >> build_summary.md

      - name: Create Release with Error Log
        if: steps.gradle_build.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "failed-run-${{ github.run_number }}"
          name: "Build Failed (Run ${{ github.run_number }})"
          body_path: build_summary.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail Job If Build Failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1
